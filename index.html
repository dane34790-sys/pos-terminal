<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💳 POS Terminal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="POS Terminal">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/349/349221.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
        }
        #posScreen {
            width: 100%;
            height: 100vh;
        }
        .swipe-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
        }
        .swipe-screen .card-icon {
            font-size: 80px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .swipe-screen .title {
            font-size: 28px;
            color: #ffcc00;
            margin-top: 20px;
            font-weight: bold;
        }
        .swipe-screen .subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .pin-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background: #000;
        }
        .pin-dots {
            font-size: 50px;
            letter-spacing: 20px;
            margin: 30px 0;
            color: #ffcc00;
        }
        .pin-keypad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            max-width: 320px;
            width: 100%;
        }
        .pin-key {
            padding: 22px;
            font-size: 24px;
            background: rgba(26, 26, 46, 0.9);
            color: #ffcc00;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .pin-key:active {
            background: #ffcc00;
            color: #000;
            transform: scale(0.95);
        }
        .pin-key.clear {
            color: #ff4444;
            border-color: #ff4444;
        }
        .amount-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background: #000;
        }
        .amount-input {
            font-size: 36px;
            background: transparent;
            border: none;
            border-bottom: 3px solid #ffcc00;
            color: #ffcc00;
            text-align: center;
            width: 250px;
            padding: 10px;
            margin: 20px 0;
            outline: none;
        }
        .amount-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .amount-btn.cancel {
            background: #ff4444;
            color: #fff;
        }
        .result-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background: #000;
            text-align: center;
        }
        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .result-msg {
            font-size: 22px;
            white-space: pre-line;
            line-height: 1.8;
        }
        .new-transaction-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .employee-info {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="posScreen">
        <div class="swipe-screen">
            <div>
                <div class="card-icon">💳</div>
                <div class="title">MASTERCARD</div>
                <div class="subtitle">Commerzbank Secure Terminal</div>
                <div class="subtitle" style="margin-top:20px; color:#ffcc00;">کارت را بکشید</div>
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('pos-sw.js')
                .then(reg => console.log('✅ Service Worker رجیستر شد'))
                .catch(err => console.error('❌ Service Worker خطا:', err));
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
